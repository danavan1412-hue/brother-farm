<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE BROTHER FARM - Peternakan Ayam</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">
    <!-- Firebase SDK (Realtime Database) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col">
        <!-- Header -->
        <header class="bg-green-600 text-white p-4 text-center shadow-md">
            <h1 class="text-xl font-bold"><i class="fa-solid fa-drumstick-bite mr-2"></i> THE BROTHER FARM</h1>
            <p class="text-xs text-green-100">Pencatatan Peternakan Ayam & Keuangan (Real-Time)</p>
        </header>

        <!-- Main Content -->
        <main class="p-4 flex-grow space-y-4">
            <!-- Form Input Penjualan/Transaksi Ayam -->
            <div class="bg-green-50 border border-green-200 rounded-lg p-4 shadow-sm">
                <h2 class="font-semibold text-green-800 text-sm mb-3">
                    <i class="fa-solid fa-plus-circle mr-1"></i> Tambah Transaksi Ayam
                </h2>
                <form id="farmForm" class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Kategori / Produk</label>
                        <select id="itemCategory" class="w-full p-2 text-sm border rounded-md focus:ring-2 focus:ring-green-500 bg-white" required>
                            <option value="Ayam Hidup / Potong">Ayam Hidup / Potong</option>
                            <option value="Telur Ayam">Telur Ayam (Kg / Karpet)</option>
                            <option value="Bibit Ayam (DOC)">Bibit Ayam (DOC)</option>
                            <option value="Pembelian Pakan">Pembelian Pakan</option>
                            <option value="Lain-lain">Lain-lain</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Keterangan / Nama Barang</label>
                        <input type="text" id="itemName" required class="w-full p-2 text-sm border rounded-md focus:ring-2 focus:ring-green-500" placeholder="Contoh: Ayam Broiler 50 Ekor / Pakan BR1">
                    </div>

                    <div class="flex gap-2">
                        <div class="w-1/2">
                            <label class="block text-xs font-medium text-gray-700 mb-1">Jumlah (Ekor/Kg/Sak)</label>
                            <input type="number" id="itemQty" min="1" required class="w-full p-2 text-sm border rounded-md focus:ring-2 focus:ring-green-500" placeholder="10">
                        </div>
                        <div class="w-1/2">
                            <label class="block text-xs font-medium text-gray-700 mb-1">Total Harga (Rp)</label>
                            <input type="number" id="itemPrice" min="0" required class="w-full p-2 text-sm border rounded-md focus:ring-2 focus:ring-green-500" placeholder="350000">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-md text-sm font-semibold hover:bg-green-700 transition">
                        <i class="fa-solid fa-cloud-arrow-up mr-1"></i> Simpan & Sinkronkan
                    </button>
                </form>
            </div>

            <!-- Daftar Riwayat Transaksi -->
            <div>
                <h3 class="font-bold text-gray-800 text-sm mb-2 flex justify-between items-center">
                    <span><i class="fa-solid fa-list-check mr-1"></i> Riwayat Transaksi (Live)</span>
                    <span id="dataCount" class="text-xs bg-green-100 text-green-800 px-2 py-0.5 rounded-full font-normal">0 data</span>
                </h3>
                <div id="farmList" class="space-y-2">
                    <p class="text-xs text-gray-500 text-center py-4">Memuat data dari database real-time...</p>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-gray-50 text-center py-3 text-xs text-gray-500 border-t">
            &copy; 2026 The Brother Farm - Peternakan Ayam
        </footer>
    </div>

    <!-- Script Real-Time Database -->
    <script>
        // Konfigurasi Database Online Firebase Brother Farm
        const firebaseConfig = {
            databaseURL: "https://brother-farm-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const farmForm = document.getElementById('farmForm');
        const farmList = document.getElementById('farmList');
        const dataCount = document.getElementById('dataCount');

        // Simpan data ke Firebase Realtime Database
        farmForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const category = document.getElementById('itemCategory').value;
            const name = document.getElementById('itemName').value;
            const qty = document.getElementById('itemQty').value;
            const price = document.getElementById('itemPrice').value;
            const date = new Date().toLocaleDateString('id-ID', { 
                day: 'numeric', 
                month: 'short', 
                year: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit' 
            });

            db.ref('brother_farm_ayam').push({
                category: category,
                name: name,
                qty: qty,
                price: price,
                date: date,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });

            farmForm.reset();
        });

        // Tampilkan data real-time ke semua HP pengguna
        db.ref('brother_farm_ayam').orderByChild('timestamp').on('value', (snapshot) => {
            farmList.innerHTML = '';
            const data = snapshot.val();
            
            if (!data) {
                farmList.innerHTML = '<p class="text-xs text-gray-500 text-center py-4">Belum ada data pencatatan ayam.</p>';
                dataCount.innerText = '0 data';
                return;
            }

            let html = '';
            let totalItem = 0;
            let itemsArray = [];

            snapshot.forEach((childSnapshot) => {
                itemsArray.unshift({ id: childSnapshot.key, ...childSnapshot.val() });
                totalItem++;
            });

            dataCount.innerText = `${totalItem} data`;

            itemsArray.forEach((item) => {
                html += `
                    <div class="bg-white border border-gray-200 rounded-lg p-3 shadow-xs flex justify-between items-center">
                        <div>
                            <span class="inline-block px-2 py-0.5 text-[10px] bg-green-100 text-green-800 rounded font-semibold mb-1">${item.category}</span>
                            <h4 class="font-semibold text-sm text-gray-800">${item.name}</h4>
                            <p class="text-xs text-gray-500">Jumlah: <span class="font-medium text-gray-700">${item.qty}</span> | ${item.date}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-xs font-bold text-green-600">Rp ${Number(item.price).toLocaleString('id-ID')}</span>
                        </div>
                    </div>
                `;
            });

            farmList.innerHTML = html;
        });
    </script>
</body>
</html>
