<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE BROTHER FARM - Pencatatan Keuangan & Peternakan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK (Realtime Database & Auth) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col">
        <header class="bg-green-600 text-white p-4 text-center shadow-md">
            <h1 class="text-xl font-bold"><i class="fa-solid fa-cow mr-2"></i> THE BROTHER FARM</h1>
            <p class="text-xs text-green-100">Sinkronisasi Real-Time Antar HP</p>
        </header>

        <main class="p-4 flex-grow space-y-4">
            <!-- Form Input Penjualan -->
            <div class="bg-green-50 border border-green-200 rounded-lg p-4 shadow-sm">
                <h2 class="font-semibold text-green-800 text-md mb-3"><i class="fa-solid fa-plus-circle mr-1"></i> Tambah Data Penjualan</h2>
                <form id="salesForm" class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Nama Ternak / Barang</label>
                        <input type="text" id="itemName" required class="w-full p-2 text-sm border rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="Contoh: Sapi Potong / Kambing">
                    </div>
                    <div class="flex gap-2">
                        <div class="w-1/2">
                            <label class="block text-xs font-medium text-gray-700 mb-1">Jumlah</label>
                            <input type="number" id="itemQty" required class="w-full p-2 text-sm border rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="1">
                        </div>
                        <div class="w-1/2">
                            <label class="block text-xs font-medium text-gray-700 mb-1">Total Harga (Rp)</label>
                            <input type="number" id="itemPrice" required class="w-full p-2 text-sm border rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="5000000">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-md text-sm font-semibold hover:bg-green-700 transition">Simpan & Sinkronkan</button>
                </form>
            </div>

            <!-- Daftar Riwayat Penjualan -->
            <div>
                <h3 class="font-bold text-gray-800 text-sm mb-2"><i class="fa-solid fa-list mr-1"></i> Riwayat Penjualan (Live Update)</h3>
                <div id="salesList" class="space-y-2">
                    <p class="text-xs text-gray-500 text-center py-4">Memuat data dari database...</p>
                </div>
            </div>
        </main>

        <footer class="bg-gray-50 text-center py-3 text-xs text-gray-500 border-t">
            &copy; 2026 The Brother Farm
        </footer>
    </div>

    <!-- Script Koneksi Database -->
    <script>
        // Konfigurasi Firebase Publik untuk Brother Farm
        const firebaseConfig = {
            databaseURL: "https://brother-farm-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const salesForm = document.getElementById('salesForm');
        const salesList = document.getElementById('salesList');

        // Kirim data ke database saat tombol submit diklik
        salesForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('itemName').value;
            const qty = document.getElementById('itemQty').value;
            const price = document.getElementById('itemPrice').value;
            const date = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

            db.ref('sales').push({
                name: name,
                qty: qty,
                price: price,
                date: date
            });

            salesForm.reset();
        });

        // Ambil dan tampilkan data secara real-time dari database
        db.ref('sales').on('value', (snapshot) => {
            salesList.innerHTML = '';
            const data = snapshot.val();
            if (!data) {
                salesList.innerHTML = '<p class="text-xs text-gray-500 text-center py-4">Belum ada data penjualan.</p>';
                return;
            }

            let html = '';
            for (let id in data) {
                let item = data[id];
                html += `
                    <div class="bg-white border border-gray-200 rounded-lg p-3 shadow-xs flex justify-between items-center">
                        <div>
                            <h4 class="font-semibold text-sm text-gray-800">${item.name}</h4>
                            <p class="text-xs text-gray-500">Jumlah: ${item.qty} | ${item.date}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-xs font-bold text-green-600">Rp ${Number(item.price).toLocaleString('id-ID')}</span>
                        </div>
                    </div>
                `;
            }
            salesList.innerHTML = html;
        });
    </script>
</body>
</html>
